name: Build GitSync Custom

on:
  workflow_dispatch:
  push:
    branches: [editor-text-color]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.88.0'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;29.0.13113456'
      - name: Prepare personal build
        env:
          CUSTOM_DEBUG_KEYSTORE: ${{ secrets.CUSTOM_DEBUG_KEYSTORE }}
        run: |
          cp lib/constant/secrets.dart.template lib/constant/secrets.dart
          mkdir -p "$HOME/.android"
          test -n "$CUSTOM_DEBUG_KEYSTORE"
          printf '%s' "$CUSTOM_DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - run: flutter pub get
      - name: Generate Rust bindings
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
          cargo install cargo-expand --version 1.0.121 --locked
          flutter_rust_bridge_codegen generate
          git checkout HEAD -- rust/src/frb_generated.rs
      - name: Check editor changes
        run: flutter analyze lib/ui/page/code_editor.dart lib/api/manager/storage.dart
      - name: Build ARM64 APK
        run: flutter build apk --debug --target-platform android-arm64 --build-number "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: GitSync-Custom-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
